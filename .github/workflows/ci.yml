name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client has to be generated before any package that imports it
      # can be typechecked.
      - name: Generate Prisma client
        run: pnpm --filter @ice/db exec prisma generate

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Lint (errors fail the build; warnings are allowed)
        run: pnpm lint:check

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit
        env:
          NODE_ENV: test

      - name: Build web app
        run: pnpm --filter @ice/web build

      - name: Audit dependencies (high+ only, non-blocking)
        run: pnpm audit --prod --audit-level=high || true
