services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ice_saas
      POSTGRES_USER: ice
      POSTGRES_PASSWORD: icedev
    ports:
      - '5555:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ice -d ice_saas']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: ./apps/gateway
    ports:
      - '5001:5001'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://ice:icedev@postgres:5432/ice_saas
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
      PORT: 5001

volumes:
  pgdata:
