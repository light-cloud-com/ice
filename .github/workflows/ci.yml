name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Typecheck shared package
        run: npx tsc --noEmit -p packages/shared/tsconfig.json

      - name: Unit tests
        run: npx vitest run --root .
        env:
          NODE_ENV: test

      - name: Build check (catches import resolution errors)
        run: pnpm test:build

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high || true
