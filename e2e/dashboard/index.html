<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>ICE GCP Test Dashboard</title>
<style>
:root {
  --bg: #0b0d14; --surface: #151823; --surface-2: #1c2030; --border: #262a3a;
  --text: #e8eaf0; --dim: #7c819a; --pass: #34d399; --fail: #f87171;
  --partial: #fbbf24; --skip: #6b7280; --accent: #6366f1; --accent-hover: #818cf8;
  --hover: #1e2235; --radius: 10px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
.app { max-width:1080px; margin:0 auto; padding:24px 20px 48px; }

/* ── Header ──────────────────────────────────────────────── */
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--border); }
.header-left { display:flex; align-items:center; gap:12px; }
.header-left h1 { font-size:18px; font-weight:700; letter-spacing:-.02em; }
.header-logo { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg, var(--accent), #a78bfa); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff; }
.btn-group { display:flex; gap:8px; }

/* ── Buttons ─────────────────────────────────────────────── */
.btn { padding:8px 18px; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition-property:background-color,opacity,box-shadow; transition-duration:.15s; }
.btn:focus-visible { outline:none; box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.btn:active { transform:scale(.97); }
.btn-run { background:var(--pass); color:#0b0d14; }
.btn-run:hover { background:#2dd4a0; }
.btn-run:disabled { opacity:.35; cursor:not-allowed; transform:none; }
.btn-stop { background:var(--fail); color:#fff; }
.btn-stop:hover { background:#ef4444; }
.btn-stop:disabled { opacity:.35; cursor:not-allowed; transform:none; }
.btn-report { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn-report:hover { background:var(--hover); border-color:var(--dim); }

/* ── Preflight ───────────────────────────────────────────── */
.preflight { display:flex; align-items:center; gap:16px; padding:10px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; font-size:13px; }
.pf-item { display:flex; align-items:center; gap:6px; }
.pf-dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex-shrink:0; }
.pf-dot.ok { background:var(--pass); box-shadow:0 0 6px rgba(52,211,153,.4); }
.pf-dot.bad { background:var(--fail); box-shadow:0 0 6px rgba(248,113,113,.4); }
.pf-dot.checking { background:var(--partial); animation:pulse 1s infinite; }
.pf-hint { margin-left:auto; font-size:12px; }

/* ── Config ──────────────────────────────────────────────── */
.config { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:20px; }
.config-field { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px 10px; }
.config-field label { display:block; font-size:10px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
.config-field input, .config-field select { width:100%; padding:7px 10px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; transition-property:border-color,box-shadow; transition-duration:.15s; }
.config-field input:focus, .config-field select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,.15); }

/* ── Repo Bar ────────────────────────────────────────────── */
.repo-bar { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; font-size:13px; }
.btn-repo-create { padding:6px 14px; border:none; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; transition-property:background-color,opacity; transition-duration:.15s; }
.btn-repo-create:hover { background:var(--accent-hover); }
.btn-repo-create:disabled { opacity:.4; cursor:not-allowed; }
.btn-repo-delete { padding:6px 14px; border:1px solid var(--border); border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; background:transparent; color:var(--dim); transition-property:background-color,border-color; transition-duration:.15s; }
.btn-repo-delete:hover { background:var(--hover); border-color:var(--fail); color:var(--fail); }

/* ── Collapsible Panel ────────────────────────────────────── */
.panel { border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); margin-bottom:16px; overflow:hidden; }
.panel-header { display:flex; align-items:center; gap:8px; padding:12px 16px; cursor:pointer; user-select:none; transition-property:background-color; transition-duration:.1s; }
.panel-header:hover { background:var(--hover); }
.panel-header:focus-visible { outline:none; box-shadow:inset 0 0 0 2px var(--accent); }
.panel-chevron { width:16px; height:16px; color:var(--dim); transition-property:transform; transition-duration:.2s; flex-shrink:0; }
.panel.collapsed .panel-chevron { transform:rotate(-90deg); }
.panel-title { font-size:14px; font-weight:600; flex:1; margin:0; }
.panel-body { padding:0 12px 12px; }
.panel.collapsed .panel-body { display:none; }

/* ── Template Selection ──────────────────────────────────── */
.tpl-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
.tpl-toolbar label { display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; white-space:nowrap; padding:6px 0; }
.tpl-search { flex:1; padding:8px 12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; transition-property:border-color,box-shadow; transition-duration:.15s; }
.tpl-search:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,.15); }
.tpl-filter { padding:8px 12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; }
.tpl-count { font-size:12px; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; }

/* Category groups — collapsible */
.cat-group { margin-bottom:8px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow:hidden; }
.cat-header { display:flex; align-items:center; gap:8px; padding:10px 14px; cursor:pointer; user-select:none; transition-property:background-color; transition-duration:.1s; }
.cat-header:hover { background:var(--hover); }
.cat-header:focus-visible { outline:none; box-shadow:inset 0 0 0 2px var(--accent); }
.cat-chevron { width:16px; height:16px; color:var(--dim); transition-property:transform; transition-duration:.2s; flex-shrink:0; }
.cat-group.collapsed .cat-chevron { transform:rotate(-90deg); }
.cat-name { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); }
.cat-count { font-size:11px; color:var(--dim); margin-left:auto; font-variant-numeric:tabular-nums; }
.cat-body { padding:6px 8px 8px; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:4px; }
.cat-group.collapsed .cat-body { display:none; }

.tpl-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px; cursor:pointer; transition-property:background-color,border-color; transition-duration:.12s; border:1px solid transparent; }
.tpl-item:hover { background:var(--hover); }
.tpl-item.selected { background:rgba(99,102,241,.08); border-color:rgba(99,102,241,.3); }
.tpl-item input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; flex-shrink:0; cursor:pointer; }
.tpl-name { font-weight:500; font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tpl-meta { font-size:11px; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; }

/* ── Status Banner ───────────────────────────────────────── */
.status-banner { padding:12px 16px; border-radius:var(--radius); font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.status-banner.running { background:rgba(99,102,241,.1); border:1px solid rgba(99,102,241,.25); color:var(--accent-hover); }
.status-banner.failed { background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.2); color:var(--fail); }
.status-banner.completed { background:rgba(52,211,153,.08); border:1px solid rgba(52,211,153,.2); color:var(--pass); }
.status-banner.stopped { background:rgba(107,114,128,.08); border:1px solid rgba(107,114,128,.2); color:var(--dim); }

/* ── Progress ────────────────────────────────────────────── */
.progress-section { margin-top:24px; }
.progress-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.progress-header h2 { font-size:15px; font-weight:600; }
.progress-bar-outer { height:6px; background:var(--surface); border-radius:3px; overflow:hidden; margin-bottom:14px; }
.progress-bar-inner { height:100%; background:linear-gradient(90deg, var(--accent), #a78bfa); border-radius:3px; transition-property:width; transition-duration:.6s; transition-timing-function:ease-out; }

.progress-list { display:flex; flex-direction:column; gap:3px; }
.progress-row { display:grid; grid-template-columns:36px 1fr 180px 64px 52px; align-items:center; padding:7px 12px; background:var(--surface); border-radius:8px; font-size:13px; }
.progress-status { font-weight:700; font-size:11px; text-align:center; font-variant-numeric:tabular-nums; }
.progress-status.wait { color:var(--dim); }
.progress-status.running { color:var(--accent-hover); }
.progress-status.pass { color:var(--pass); }
.progress-status.fail { color:var(--fail); }
.progress-status.partial { color:var(--partial); }
.progress-status.skip { color:var(--skip); }
.progress-phases { display:flex; gap:3px; align-items:center; }
.phase-dot { width:7px; height:7px; border-radius:50%; background:var(--border); }
.phase-dot.done { background:var(--pass); }
.phase-dot.fail { background:var(--fail); }
.phase-dot.running { background:var(--accent); animation:pulse 1s infinite; }
.progress-detail { font-size:11px; color:var(--dim); grid-column:2/6; padding-left:4px; padding-top:2px; }

/* Per-resource breakdown under a failing template row */
.resource-list { margin:4px 0 6px 44px; display:flex; flex-direction:column; gap:3px; }
.resource-row { display:flex; align-items:flex-start; gap:8px; padding:6px 10px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; font-size:11px; font-family:'SF Mono','Fira Code',Monaco,Consolas,monospace; }
.resource-row.fail { border-color:rgba(248,113,113,.35); background:rgba(248,113,113,.05); }
.resource-row.ok { opacity:.55; }
.resource-icon { flex-shrink:0; font-weight:700; font-size:10px; }
.resource-row.fail .resource-icon { color:var(--fail); }
.resource-row.ok .resource-icon { color:var(--pass); }
.resource-name { color:var(--text); font-weight:600; flex-shrink:0; }
.resource-type { color:var(--dim); flex-shrink:0; }
.resource-error { color:var(--fail); flex:1; word-break:break-word; white-space:pre-wrap; }

/* ── Logs ────────────────────────────────────────────────── */
.logs-section { margin-top:20px; }
.logs-section h2 { font-size:15px; font-weight:600; margin-bottom:8px; }
.log-box { background:#080a10; border:1px solid var(--border); border-radius:var(--radius); padding:14px; font-family:'SF Mono','Fira Code',Monaco,Consolas,monospace; font-size:11px; line-height:1.7; min-height:120px; max-height:400px; overflow-y:auto; color:var(--dim); overscroll-behavior:contain; white-space:pre-wrap; word-break:break-word; }
.log-line { display:block; }
.log-line.error { color:var(--fail); }
.log-line.warn { color:var(--partial); }
.log-line.success { color:var(--pass); }
.log-line.info { color:var(--text); }
.log-line.gateway { color:#60a5fa; }
.log-line.frontend { color:#a78bfa; }
.log-line.phase { color:var(--accent-hover); font-weight:600; }
.log-line.dim { color:var(--dim); }
.log-ts { color:#4b5163; margin-right:6px; }

/* ── Errors ──────────────────────────────────────────────── */
.error-section { margin-top:16px; }
.error-section h2 { font-size:15px; font-weight:600; margin-bottom:8px; }
.error-item { padding:8px 12px; background:rgba(248,113,113,.04); border:1px solid rgba(248,113,113,.12); border-radius:8px; font-size:12px; margin-bottom:4px; color:var(--fail); }

/* ── Shared ──────────────────────────────────────────────── */
h2 { font-size:15px; margin-bottom:8px; }
.dim { color:var(--dim); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
@keyframes spin { to { transform:rotate(360deg); } }
.spinner { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }

/* ── Responsive ──────────────────────────────────────────── */
@media (max-width:700px) {
  .config { grid-template-columns:1fr; }
  .tpl-toolbar { flex-wrap:wrap; }
  .progress-row { grid-template-columns:32px 1fr 60px; }
  .progress-phases, .progress-row > div:nth-child(5) { display:none; }
}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="header-logo" aria-hidden="true">IC</div>
      <h1>GCP Test Dashboard</h1>
    </div>
    <div class="btn-group">
      <button class="btn btn-run" id="btn-run" onclick="startRun()" aria-label="Run selected templates">Run Selected</button>
      <button class="btn btn-stop" id="btn-stop" onclick="stopRun()" disabled aria-label="Stop test run">Stop</button>
      <button class="btn btn-report" onclick="openReport()" aria-label="View test report">View Report</button>
    </div>
  </header>

  <!-- Pre-flight -->
  <div class="preflight" role="status">
    <div class="pf-item"><span class="pf-dot" id="pf-backend"></span><span>Backend</span></div>
    <div class="pf-item"><span class="pf-dot" id="pf-frontend"></span><span>Frontend</span></div>
    <span class="pf-hint dim" id="pf-hint"></span>
  </div>

  <!-- Config -->
  <div class="config" style="grid-template-columns:1fr 1fr 1fr 1fr">
    <div class="config-field">
      <label for="cfg-project">GCP Project</label>
      <input id="cfg-project" name="project" type="text" placeholder="my-gcp-project&hellip;" autocomplete="off" spellcheck="false" value="lc-ice">
    </div>
    <div class="config-field">
      <label for="cfg-region">Region</label>
      <select id="cfg-region" name="region">
        <option value="us-central1">us-central1</option>
        <option value="us-east1">us-east1</option>
        <option value="us-west1">us-west1</option>
        <option value="europe-west1">europe-west1</option>
        <option value="europe-west2">europe-west2</option>
        <option value="europe-west3" selected>europe-west3 (Frankfurt)</option>
        <option value="asia-east1">asia-east1</option>
        <option value="asia-northeast1">asia-northeast1</option>
      </select>
    </div>
    <div class="config-field">
      <label for="cfg-sa-key">SA Key File Path</label>
      <input id="cfg-sa-key" name="saKeyPath" type="text" placeholder="/path/to/sa-key.json&hellip;" autocomplete="off" spellcheck="false" value="lc-ice-7d951349384c.json">
    </div>
    <div class="config-field">
      <label for="cfg-gh-token">GitHub PAT</label>
      <input id="cfg-gh-token" name="githubToken" type="text" placeholder="ghp_&hellip;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="font-family: 'SF Mono','Fira Code',Monaco,Consolas,monospace">
    </div>
  </div>

  <!-- GitHub Test Repos -->
  <div class="repo-bar" id="repo-bar">
    <span class="dim" id="repo-status">Test repos: not checked</span>
    <button class="btn btn-repo-create" id="btn-create-repos" onclick="createTestRepos()" aria-label="Create test repositories">Create Test Repos</button>
    <button class="btn btn-repo-delete" id="btn-delete-repos" onclick="deleteTestRepos()" aria-label="Delete test repositories">Delete Repos</button>
  </div>

  <!-- Template Selection (collapsible) -->
  <div class="panel" id="tpl-panel">
    <div class="panel-header" tabindex="0" role="button" aria-expanded="true" onclick="togglePanel('tpl-panel')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePanel('tpl-panel')}">
      <svg class="panel-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 3l5 5-5 5"/></svg>
      <h2 class="panel-title">Templates</h2>
      <span class="tpl-count dim" id="selected-count">0 selected</span>
    </div>
    <div class="panel-body" id="tpl-panel-body">
      <div class="tpl-toolbar">
        <label><input type="checkbox" id="select-all" onchange="toggleAll()"> Select All</label>
        <input type="text" class="tpl-search" id="search" placeholder="Search templates&hellip;" aria-label="Search templates" oninput="filterTemplates()" autocomplete="off">
        <select class="tpl-filter" id="filter-category" aria-label="Filter by category" onchange="filterTemplates()">
          <option value="">All Categories</option>
        </select>
      </div>
      <div id="template-list"></div>
    </div>
  </div>

  <!-- Status Banner -->
  <div class="status-banner" id="status-banner" style="display:none" aria-live="polite" role="status">
    <span id="status-icon" aria-hidden="true"></span>
    <span id="status-text"></span>
  </div>

  <!-- Progress -->
  <section class="progress-section" id="progress-section">
    <div class="progress-header">
      <h2>Progress</h2>
      <span class="dim" id="progress-summary">Select templates and click Run</span>
    </div>
    <div class="progress-bar-outer" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar-wrap">
      <div class="progress-bar-inner" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="progress-list" id="progress-list"></div>
  </section>

  <!-- Logs -->
  <section class="logs-section" id="logs-section">
    <h2>Output</h2>
    <div class="log-box" id="log-box" role="log" aria-live="off">Waiting for test run&hellip;</div>
  </section>

  <!-- Errors -->
  <section class="error-section" id="error-section" style="display:none">
    <h2 id="error-heading">Errors</h2>
    <div id="error-list" aria-live="polite"></div>
  </section>
</div>

<script>
let templates = [];
let categories = [];
let eventSource = null;
let outputLines = [];
let collapsedCats = new Set();

// ── SVG Icons ──────────────────────────────────────────────
const CHEVRON_SVG = '<svg class="cat-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3l5 5-5 5"/></svg>';

// ── Init ───────────────────────────────────────────────────
fetch('/api/templates').then(r => r.json()).then(data => {
  templates = data.templates;
  categories = data.categories;
  renderTemplates();
  populateCategoryFilter();
}).catch(err => showBanner('failed', 'Failed to load templates: ' + err.message));

fetch('/api/status').then(r => r.json()).then(data => {
  if (data.status === 'running') {
    showBanner('running', 'Test run in progress\u2026');
    document.getElementById('btn-run').disabled = true;
    document.getElementById('btn-stop').disabled = false;

    startSSE();
  }
});

// Load config from .env
fetch('/api/config').then(r => r.json()).then(cfg => {
  if (cfg.githubToken) document.getElementById('cfg-gh-token').value = cfg.githubToken;
}).catch(() => {});

checkPreflight();
setInterval(checkPreflight, 10000);

async function checkPreflight() {
  const bDot = document.getElementById('pf-backend');
  const fDot = document.getElementById('pf-frontend');
  const hint = document.getElementById('pf-hint');
  bDot.className = 'pf-dot checking';
  fDot.className = 'pf-dot checking';
  hint.textContent = 'Checking\u2026';
  hint.style.color = '';

  try {
    const res = await fetch('/api/preflight');
    const data = await res.json();
    bDot.className = 'pf-dot ' + (data.backend ? 'ok' : 'bad');
    fDot.className = 'pf-dot ' + (data.frontend && data.ok ? 'ok' : data.frontend ? 'bad' : 'bad');

    if (data.ok) {
      hint.textContent = '';
      document.getElementById('btn-run').title = '';
    } else {
      hint.textContent = (data.error || '').split('\n')[0];
      hint.style.color = 'var(--fail)';
      document.getElementById('btn-run').title = data.error || 'Services not running';
    }
  } catch {
    bDot.className = 'pf-dot bad';
    fDot.className = 'pf-dot bad';
    hint.textContent = 'Cannot reach dashboard server';
    hint.style.color = 'var(--fail)';
  }
}

// ── Template Rendering ─────────────────────────────────────
function renderTemplates() {
  const search = document.getElementById('search').value.toLowerCase();
  const catFilter = document.getElementById('filter-category').value;
  const container = document.getElementById('template-list');

  const grouped = {};
  for (const t of templates) {
    if (search && !t.name.toLowerCase().includes(search) && !t.id.toLowerCase().includes(search) && !t.description?.toLowerCase().includes(search)) continue;
    if (catFilter && t.category !== catFilter) continue;
    if (!grouped[t.category]) grouped[t.category] = [];
    grouped[t.category].push(t);
  }

  let html = '';
  for (const [cat, tpls] of Object.entries(grouped)) {
    const catMeta = categories.find(c => c.id === cat);
    const isCollapsed = collapsedCats.has(cat);
    const selectedInCat = tpls.filter(t => getSelectedIdsSet().has(t.id)).length;

    html += '<div class="cat-group' + (isCollapsed ? ' collapsed' : '') + '" data-cat="' + cat + '">';
    html += '<div class="cat-header" tabindex="0" role="button" aria-expanded="' + (!isCollapsed) + '" onclick="toggleCategory(\'' + cat + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleCategory(\'' + cat + '\')}">';
    html += CHEVRON_SVG;
    html += '<span class="cat-name">' + (catMeta?.label || cat) + '</span>';
    html += '<span class="cat-count">' + (selectedInCat > 0 ? selectedInCat + '/' : '') + tpls.length + '</span>';
    html += '</div>';
    html += '<div class="cat-body">';
    for (const t of tpls) {
      const sel = getSelectedIdsSet().has(t.id);
      html += '<div class="tpl-item' + (sel ? ' selected' : '') + '" onclick="toggleTemplate(this)" role="option" aria-selected="' + sel + '">';
      html += '<input type="checkbox" data-id="' + t.id + '"' + (sel ? ' checked' : '') + ' onclick="event.stopPropagation(); this.parentElement.classList.toggle(\'selected\',this.checked); updateSelectedCount();" aria-label="' + escHtml(t.name) + '">';
      html += '<span class="tpl-name">' + escHtml(t.name) + '</span>';
      html += '<span class="tpl-meta">' + t.blockCount + ' blk' + (t.estimatedCost ? ' &middot; ' + t.estimatedCost : '') + '</span>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  if (!html) html = '<div style="padding:20px;text-align:center;color:var(--dim)">No templates match your search</div>';
  container.innerHTML = html;
  updateSelectedCount();
}

// Track selected IDs across re-renders
let _selectedIds = new Set();
function getSelectedIdsSet() { return _selectedIds; }
function getSelectedIds() { return [..._selectedIds]; }

function updateSelectedCount() {
  // Sync from DOM
  _selectedIds = new Set(
    Array.from(document.querySelectorAll('.tpl-item input[type=checkbox]:checked')).map(cb => cb.dataset.id)
  );
  document.getElementById('selected-count').textContent = _selectedIds.size + ' selected';
}

function populateCategoryFilter() {
  const select = document.getElementById('filter-category');
  for (const cat of categories) {
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = cat.label;
    select.appendChild(opt);
  }
}

function filterTemplates() { renderTemplates(); }

function togglePanel(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('collapsed');
  const header = el.querySelector('.panel-header');
  if (header) header.setAttribute('aria-expanded', !el.classList.contains('collapsed'));
}

function collapsePanel(id) {
  const el = document.getElementById(id);
  if (el && !el.classList.contains('collapsed')) {
    el.classList.add('collapsed');
    const header = el.querySelector('.panel-header');
    if (header) header.setAttribute('aria-expanded', 'false');
  }
}

function toggleCategory(cat) {
  if (collapsedCats.has(cat)) collapsedCats.delete(cat);
  else collapsedCats.add(cat);
  const el = document.querySelector('.cat-group[data-cat="' + cat + '"]');
  if (el) {
    el.classList.toggle('collapsed');
    el.querySelector('.cat-header').setAttribute('aria-expanded', !el.classList.contains('collapsed'));
  }
}

function toggleTemplate(el) {
  const cb = el.querySelector('input[type=checkbox]');
  cb.checked = !cb.checked;
  el.classList.toggle('selected', cb.checked);
  el.setAttribute('aria-selected', cb.checked);
  updateSelectedCount();
}

function toggleAll() {
  const checked = document.getElementById('select-all').checked;
  document.querySelectorAll('.tpl-item input[type=checkbox]').forEach(cb => {
    cb.checked = checked;
    cb.closest('.tpl-item').classList.toggle('selected', checked);
    cb.closest('.tpl-item').setAttribute('aria-selected', checked);
  });
  updateSelectedCount();
}

// ── Status Banner ──────────────────────────────────────────
function showBanner(type, text) {
  const banner = document.getElementById('status-banner');
  banner.style.display = 'flex';
  banner.className = 'status-banner ' + type;
  document.getElementById('status-icon').innerHTML =
    type === 'running' ? '<span class="spinner"></span>' :
    type === 'completed' ? '\u2713' :
    type === 'failed' ? '\u2717' : '\u2014';
  document.getElementById('status-text').textContent = text;
}

function hideBanner() { document.getElementById('status-banner').style.display = 'none'; }

// ── Run / Stop ─────────────────────────────────────────────
async function startRun() {
  const ids = getSelectedIds();
  const project = document.getElementById('cfg-project').value.trim();
  const region = document.getElementById('cfg-region').value;
  const saKeyPath = document.getElementById('cfg-sa-key').value.trim();

  if (!ids.length) return alert('Select at least one template');
  if (!project) return alert('Enter GCP project ID');
  if (!saKeyPath) return alert('Enter path to SA key JSON file');

  showBanner('running', 'Starting test run with ' + ids.length + ' template(s)\u2026');
  document.getElementById('btn-run').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  outputLines = [];
  appendOutput('Starting run: ' + ids.join(', '));

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ templates: ids, project, region, saKeyPath, githubToken: document.getElementById('cfg-gh-token').value.trim() }),
    });
    const data = await res.json();
    if (!data.success) {
      showBanner('failed', data.error);
      appendOutput('ERROR: ' + data.error);
      document.getElementById('btn-run').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      return;
    }
    showBanner('running', 'Playwright started. Waiting for output\u2026');
    appendOutput('Playwright process spawned');
    collapsePanel('tpl-panel');
    startSSE();
  } catch (err) {
    showBanner('failed', 'Network error: ' + err.message);
    appendOutput('ERROR: ' + err.message);
    document.getElementById('btn-run').disabled = false;
    document.getElementById('btn-stop').disabled = true;
  }
}

async function stopRun() {
  showBanner('stopped', 'Stopping\u2026');
  try { await fetch('/api/stop', { method: 'POST' }); } catch {}
  document.getElementById('btn-run').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  if (eventSource) { eventSource.close(); eventSource = null; }
  showBanner('stopped', 'Test run stopped');
}

// ── SSE + Polling ──────────────────────────────────────────
function startSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/progress');
  eventSource.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      handleProgressEvent(data);
      if (data.final) { eventSource.close(); eventSource = null; }
    } catch {}
  };
  eventSource.onerror = () => {
    if (eventSource) { eventSource.close(); eventSource = null; }
    appendOutput('SSE disconnected, polling\u2026');
    setTimeout(pollProgress, 2000);
  };
}

async function pollProgress() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    handleProgressEvent({ runnerStatus: data.status, error: data.error, progress: data.progress, newOutput: [] });
    const outRes = await fetch('/api/output');
    const outData = await outRes.json();
    if (outData.output?.length) {
      const newLines = outData.output.slice(outputLines.length);
      for (const line of newLines) appendOutput(line);
    }
    if (data.status === 'running') setTimeout(pollProgress, 2000);
    else onRunFinished(data.status, data.error);
  } catch { setTimeout(pollProgress, 3000); }
}

function handleProgressEvent(data) {
  const { runnerStatus, error, progress, newOutput } = data;
  if (newOutput?.length) { for (const line of newOutput) appendOutput(line); }

  if (runnerStatus === 'running') {
    if (progress) {
      showBanner('running', 'Running: ' + (progress.completed||0) + '/' + (progress.total||0) + ' templates (' + formatMs(progress.elapsed_ms||0) + ')');
    } else {
      showBanner('running', 'Running\u2026 waiting for first update');
    }
  } else if (runnerStatus === 'completed') { onRunFinished('completed', null); }
  else if (runnerStatus === 'failed') { onRunFinished('failed', error); }
  else if (runnerStatus === 'stopped') { onRunFinished('stopped', null); }

  if (progress) updateProgressUI(progress);
}

function onRunFinished(status, error) {
  document.getElementById('btn-run').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  if (status === 'completed') showBanner('completed', 'Test run completed');
  else if (status === 'failed') showBanner('failed', 'Test run failed' + (error ? ': ' + error : ''));
  else showBanner('stopped', 'Test run stopped');
}

// ── Progress UI ────────────────────────────────────────────
const PHASES = ['templateSelect','canvasLoad','plan','deploy','verify','destroy','verifyRemoval'];
const STATUS_LABELS = { wait:'\u2014', running:'\u25B6', pass:'\u2713', fail:'\u2717', partial:'!!', skip:'\u2014' };

function updateProgressUI(p) {
  const done = p.completed||0, total = p.total||1;
  const pct = Math.round((done/total)*100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-bar-wrap')?.setAttribute('aria-valuenow', pct);
  document.getElementById('progress-summary').textContent = done+'/'+total+' \u00b7 '+formatMs(p.elapsed_ms||0);

  let html = '';
  for (const t of (p.templates||[])) {
    html += '<div class="progress-row">';
    html += '<div class="progress-status '+t.status+'">'+(STATUS_LABELS[t.status]||t.status)+'</div>';
    html += '<div>'+escHtml(t.name)+'</div>';
    html += '<div class="progress-phases">';
    for (const ph of PHASES) {
      const ps = t.phases?.[ph]?.status||'pending';
      html += '<div class="phase-dot '+ps+'" title="'+ph+'"></div>';
    }
    html += '</div>';
    html += '<div class="dim" style="font-variant-numeric:tabular-nums">'+formatMs(t.duration_ms||0)+'</div>';
    html += '<div class="dim" style="font-variant-numeric:tabular-nums">'+(t.resources?t.resources.success+'/'+t.resources.total:'\u2014')+'</div>';
    html += '</div>';
    if (t.currentDetail) html += '<div class="progress-detail">\u2514 '+escHtml(t.currentDetail)+'</div>';

    // Per-resource breakdown — show failed rows always, collapse successes if any failed.
    const details = t.resourceDetails || [];
    if (details.length) {
      const anyFailed = details.some(d => !d.success);
      const rows = anyFailed ? details.filter(d => !d.success) : [];
      if (rows.length) {
        html += '<div class="resource-list">';
        for (const r of rows) {
          const cls = r.success ? 'ok' : 'fail';
          const icon = r.success ? '\u2713' : '\u2717';
          html += '<div class="resource-row '+cls+'">';
          html += '<span class="resource-icon">'+icon+'</span>';
          html += '<span class="resource-name">'+escHtml(r.name||'')+'</span>';
          html += '<span class="resource-type">'+escHtml(r.type||'')+'</span>';
          if (r.error) html += '<span class="resource-error">'+escHtml(r.error)+'</span>';
          html += '</div>';
        }
        html += '</div>';
      }
    }
  }
  document.getElementById('progress-list').innerHTML = html;

  if (p.logs?.length) { for (const l of p.logs.slice(-5)) { if (!outputLines.includes(l)) appendOutput(l); } }

  const errors = p.errors||[];
  if (errors.length) {
    document.getElementById('error-section').style.display = 'block';
    document.getElementById('error-heading').textContent = 'Errors ('+errors.length+')';
    document.getElementById('error-list').innerHTML = errors.map(e => '<div class="error-item">'+escHtml(e)+'</div>').join('');
  }
}

// ── Output Log ─────────────────────────────────────────────
function classifyLogLine(line) {
  const s = String(line);
  const lower = s.toLowerCase();
  if (/\b(error|fail(ed|ure)?|exception|rejected|denied|unauthori[sz]ed|ERR|XX)\b/i.test(s)) return 'error';
  if (/\b(warn(ing)?|deprecat|skipped|partial|!!)\b/i.test(s)) return 'warn';
  if (/\b(success|succeeded|passed|done|completed|ready|OK|\u2713)\b/i.test(s)) return 'success';
  if (/^\s*\[gw\]/i.test(s)) return 'gateway';
  if (/^\s*\[(web|fe|vite)\]/i.test(s)) return 'frontend';
  if (/\b(plan|deploy|verify|destroy|phase|template)\b/i.test(lower) && /:|>|starting|running/i.test(lower)) return 'phase';
  return 'info';
}

function renderLogLine(line) {
  const cls = classifyLogLine(line);
  // Pull out leading timestamp like [14:43:03] or 14:43:03 for dim styling
  const m = String(line).match(/^(\[?\d{2}:\d{2}:\d{2}\]?)\s+(.*)$/);
  if (m) {
    return '<span class="log-line ' + cls + '"><span class="log-ts">' + escHtml(m[1]) + '</span>' + escHtml(m[2]) + '</span>';
  }
  return '<span class="log-line ' + cls + '">' + escHtml(line) + '</span>';
}

function renderAllOutput() {
  const box = document.getElementById('log-box');
  box.innerHTML = outputLines.map(renderLogLine).join('\n');
  box.scrollTop = box.scrollHeight;
}

function appendOutput(line) {
  outputLines.push(line);
  if (outputLines.length > 500) outputLines = outputLines.slice(-500);
  renderAllOutput();
}

// ── Helpers ────────────────────────────────────────────────
function formatMs(ms) {
  if (!ms) return '0s';
  if (ms < 1000) return ms+'ms';
  if (ms < 60000) return (ms/1000).toFixed(0)+'s';
  return Math.floor(ms/60000)+'m'+Math.round((ms%60000)/1000)+'s';
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function openReport() { window.open('/api/report/html','_blank'); }

// ── Test Repos ─────────────────────────────────────────────
async function createTestRepos() {
  const token = document.getElementById('cfg-gh-token').value.trim();
  if (!token) return alert('Enter a GitHub PAT (ghp_...) with repo + delete_repo scopes');

  const statusEl = document.getElementById('repo-status');
  const btn = document.getElementById('btn-create-repos');
  btn.disabled = true;
  statusEl.textContent = 'Creating test repos\u2026';
  statusEl.style.color = 'var(--accent)';

  try {
    const res = await fetch('/api/repos/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ githubToken: token }),
    });
    const data = await res.json();
    const repos = Array.isArray(data.repos) ? data.repos : [];
    const created = repos.filter(r => r.status === 'created').length;
    const existed = repos.filter(r => r.status === 'existed').length;
    const failed = repos.filter(r => r.status === 'failed');

    if (failed.length > 0) {
      // Any per-repo failure — surface the real GitHub errors regardless of
      // whether the top-level success flag came back true or false.
      statusEl.textContent = failed.length + '/' + repos.length + ' repo(s) failed'
        + ' (' + created + ' created, ' + existed + ' existed)';
      statusEl.style.color = 'var(--fail)';

      const errSection = document.getElementById('error-section');
      const errHeading = document.getElementById('error-heading');
      const errList = document.getElementById('error-list');
      if (errSection && errHeading && errList) {
        errSection.style.display = 'block';
        errHeading.textContent = 'Repo creation errors (' + failed.length + ')';
        errList.innerHTML = failed.map(r =>
          '<div class="error-item"><strong>' + escHtml(r.fullName || r.name) + '</strong>: ' + escHtml(r.error || 'unknown') + '</div>'
        ).join('');
      }
      appendOutput('Repo creation: ' + failed.length + '/' + repos.length + ' failed');
      for (const r of failed) appendOutput('  ' + (r.fullName || r.name) + ': ' + (r.error || 'unknown'));

      // Hint at the most common root cause without being preachy about it.
      if (failed.some(r => /403|not accessible/i.test(r.error || ''))) {
        appendOutput('Hint: fine-grained PATs need org Administration: Read and write, approved by a light-cloud-com owner. Classic PATs need repo + delete_repo + admin:org (SSO-authorized).');
      }
    } else if (data.success === false) {
      // Request itself failed server-side and no per-repo data came back.
      statusEl.textContent = 'Failed: ' + (data.error || 'unknown error');
      statusEl.style.color = 'var(--fail)';
    } else {
      statusEl.textContent = repos.length + ' repos ready (' + created + ' created, ' + existed + ' existed)';
      statusEl.style.color = 'var(--pass)';
    }
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    statusEl.style.color = 'var(--fail)';
  }
  btn.disabled = false;
}

async function deleteTestRepos() {
  if (!confirm('Delete all ice-test-* repos from light-cloud-com?')) return;
  const statusEl = document.getElementById('repo-status');
  const token = document.getElementById('cfg-gh-token').value.trim();
  statusEl.textContent = 'Deleting test repos\u2026';
  statusEl.style.color = 'var(--partial)';

  try {
    const res = await fetch('/api/repos/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ githubToken: token }),
    });
    const data = await res.json();

    const deleted = Array.isArray(data.deleted) ? data.deleted : [];
    const failed = Array.isArray(data.failed) ? data.failed : [];
    const discovered = typeof data.discovered === 'number' ? data.discovered : deleted.length + failed.length;

    if (failed.length > 0) {
      statusEl.textContent = failed.length + '/' + discovered + ' repo(s) failed to delete (' + deleted.length + ' deleted)';
      statusEl.style.color = 'var(--fail)';
      const errSection = document.getElementById('error-section');
      const errHeading = document.getElementById('error-heading');
      const errList = document.getElementById('error-list');
      if (errSection && errHeading && errList) {
        errSection.style.display = 'block';
        errHeading.textContent = 'Repo delete errors (' + failed.length + ')';
        errList.innerHTML = failed.map(r =>
          '<div class="error-item"><strong>' + escHtml(r.name) + '</strong>: ' + escHtml(r.error || 'unknown') + '</div>'
        ).join('');
      }
      appendOutput('Repo delete: ' + failed.length + '/' + discovered + ' failed');
      for (const r of failed) appendOutput('  ' + r.name + ': ' + (r.error || 'unknown'));
      if (failed.some(r => /403|not accessible/i.test(r.error || ''))) {
        appendOutput('Hint: deletion needs Repository permissions -> Administration: Read and write on the fine-grained PAT.');
      }
    } else if (data.success === false) {
      statusEl.textContent = 'Failed: ' + (data.error || 'unknown error');
      statusEl.style.color = 'var(--fail)';
    } else if (discovered === 0) {
      statusEl.textContent = 'No ice-test-* repos found in light-cloud-com';
      statusEl.style.color = 'var(--dim)';
    } else {
      statusEl.textContent = deleted.length + ' repo(s) deleted';
      statusEl.style.color = 'var(--dim)';
      appendOutput('Deleted ' + deleted.length + ' test repo(s): ' + deleted.join(', '));
    }
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    statusEl.style.color = 'var(--fail)';
  }
}
