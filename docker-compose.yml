services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ice_community
      POSTGRES_USER: ice
      POSTGRES_PASSWORD: icedev
    ports:
      - '5557:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ice -d ice_community']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
