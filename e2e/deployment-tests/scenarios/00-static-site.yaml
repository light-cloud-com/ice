id: static-site
name: Static Site (qs-static-site)
description: |
  Loads the "Static Site" quick-start template (id: qs-static-site) and
  deploys it as-is to GCP. Verifies a Cloud Storage bucket is created and
  cleans up afterwards.

  No extra blocks placed — this scenario validates the full happy path of
  the template's own design without the harness drawing on top of it.

baseTemplate: Static Site                       # name as it appears on /templates

project:
  gcp:
    project: ${ICE_TEST_GCP_PROJECT}
    region: us-central1

blocks: []
connections: []

expect:
  # Static Site deploys to Firebase Hosting (gcp.firebase.hosting.site).
  # We don't have a gcloud verifier for it yet, so we rely on the apply
  # response: empty resources → verify just confirms apply.success === true.
  # The deploy log + the per-resource list (logged by verify) tells you
  # what actually landed.
  resources: []

recipes:
  allow:
    - api_not_enabled
    - network
  forbid:
    - "*"

cleanup:
  destroyOnSuccess: true
  destroyOnFailure: false
