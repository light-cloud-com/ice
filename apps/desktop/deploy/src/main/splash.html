<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      -webkit-app-region: drag;
      user-select: none;
    }
    .header {
      padding: 30px 80px 20px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: left;
      text-transform: uppercase;
    }
    .splash {
      background: #0f1117;
      border-radius: 0px;
      text-align: center;
    }
    .logo {
      width: 128px;
      height: 128px;
      display: block;
    }
    .title {
      font-size: 22px;
      font-weight: 400;
      color: #ffffff;
    }
    .loader {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 28px;
    }
    .meta {
      padding: 20px 0 20px;
      display: flex;
      align-items: start;
      justify-content: center;
      gap: 10px;
      font-size: 12px;
      color: #71717a;
    }
    .meta a {
      color: #a1a1aa;
      text-decoration: none;
      -webkit-app-region: no-drag;
    }
    .dot { opacity: 0.4; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
