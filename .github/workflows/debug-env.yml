name: debug-env
on:
  push:
    branches: [fix/desktop-bundle]
  workflow_dispatch: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ice/db exec prisma generate
      - name: patch pnpm collector — use a SHALLOW depth so the dump isn't 105 MB
        run: |
          F=$(find node_modules/.pnpm -path "*app-builder-lib@26*/out/node-module-collector/pnpmNodeModulesCollector.js" | head -1)
          echo "patching: $F"
          sed -i 's/"--depth", "6"/"--depth", "0"/' "$F"
          echo "after patch:"; grep -E "depth" "$F" | head -2
      - name: build — does the collector pass with a clean spawn env?
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set +e
          pnpm --filter @ice/desktop run prebuild
          pnpm --filter @ice/desktop exec electron-vite build
          pnpm --filter @ice/desktop exec electron-builder --linux --dir --publish never 2>&1 \
            | grep -E "error parsing|Node module collector|packaging|linux-unpacked|completed|installing native|⨯|file=" \
            | head -25
          echo "EB_EXIT=${PIPESTATUS[0]}"
