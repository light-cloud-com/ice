# Gitleaks config for ICE. Keep narrow — false positives discourage use.
#
# Run locally:   gitleaks detect --config .gitleaks.toml
# Pre-commit:    handled by .github/workflows/secret-scan.yml on every PR.

title = "ICE secret-scanning"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and intentional placeholders"
paths = [
  '''\.env\.example$''',
  '''(?i)\.gitleaks\.toml$''',
  '''CHANGELOG\.md$''',
  '''OSS_LAUNCH_CHECKLIST\.md$''',
  '''docs/.*\.md$''',
  '''^e2e/.*\.spec\.ts$''',
  '''^e2e/mocks/''',
  '''^packages/.*/__tests__/''',
  '''^packages/.*/dist/''',
  '''^services/.*/__tests__/''',
  '''^apps/.*/__tests__/''',
  '''^node_modules/''',
]
regexes = [
  '''test-secret''',
  '''test-encryption-key-min-32chars''',
  '''desktop-dev-key-32chars''',
  '''change-me-to-a-random-string''',
  '''change-me-32-characters-exactly''',
  '''ICE_SEED_PASSWORD''',
]

# Tighten the built-in Anthropic rule — we only want to flag committed keys,
# not env-example placeholders or doc references.
[[rules]]
id = "anthropic-api-key-strict"
description = "Anthropic API key committed to repo"
regex = '''sk-ant-(api|admin)\d{2}-[A-Za-z0-9_-]{80,}'''
keywords = ["sk-ant-"]
