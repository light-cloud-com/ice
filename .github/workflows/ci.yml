name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Typecheck shared package
        run: npx tsc --noEmit -p packages/shared/tsconfig.json

      - name: Unit tests
        run: npx vitest run --root . packages/shared/src/__tests__/ services/iam/src/__tests__/ services/deploy/src/__tests__/ packages/core/src/__tests__/card-translator.test.ts
        env:
          NODE_ENV: test

      - name: Build web app
        run: cd packages/web && npx vite build

      - name: Format check
        run: npx prettier --check "packages/**/*.{ts,tsx}" "services/**/*.{ts,tsx}" "apps/**/*.{ts,tsx}"

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high || true
